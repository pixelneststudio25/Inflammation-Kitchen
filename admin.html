<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inflammation Kitchen: Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  [hidden]{display:none!important}
  body{background:#F4F5F3}
  button{font-family:inherit}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
  .login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
  .login .card{max-width:360px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
  .login img{height:44px;margin:0 auto}
  .hint{font-size:.85rem;color:var(--ink-2)}
  .hd{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
  .brand{display:flex;align-items:center;gap:10px}.brand img{height:30px;width:auto}.brand b{font:700 1.05rem 'Fraunces',serif;color:var(--green)}
  .ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-2);transition:background .25s var(--ease)}
  .ic:hover{background:var(--cream-2)}.ic svg{width:18px;height:18px}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 16px 12px;max-width:720px;margin:0 auto}
  .seg button{padding:10px 6px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:.85rem;color:var(--ink-2);transition:background .25s var(--ease),color .25s var(--ease)}
  .seg button.on{background:var(--green);border-color:var(--green);color:#fff}
  main.ad{max-width:720px;margin:0 auto;padding:16px 16px 130px;display:flex;flex-direction:column;gap:12px}
  .ac{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .ah{width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;background:none;border:0;text-align:left;cursor:pointer}
  .hn{flex:1;min-width:0;display:flex;flex-direction:column}
  .hn b{font:700 1.02rem 'Fraunces',serif;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hn small{color:var(--ink-2);font-size:.82rem}
  .chip{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;background:#FBE9E6;color:var(--red)}
  .chev{width:18px;height:18px;flex-shrink:0;color:var(--ink-2);transition:transform .3s var(--ease)}
  .ac.open .chev{transform:rotate(180deg)}
  .ab{display:none;padding:2px 16px 18px;border-top:1px solid var(--line)}
  .ac.open .ab{display:block}
  .f{display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:700;margin-top:14px}
  .in{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;font:400 .95rem 'DM Sans',sans-serif;background:#fff;color:var(--ink)}
  .in:focus{border-color:var(--green);outline:none}
  textarea.in{resize:vertical;min-height:110px}
  .g2{display:grid;gap:0 12px}@media(min-width:560px){.g2{grid-template-columns:1fr 1fr}}
  .tg{position:relative;display:inline-flex;flex-shrink:0}
  .tg input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
  .tg span{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:.8rem;color:var(--ink-2);transition:background .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease)}
  .tg input:checked+span{background:var(--red);border-color:var(--red);color:#fff}
  .tg input:focus-visible+span{outline:2px solid var(--red);outline-offset:2px}
  .row2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}
  .pr{display:flex;align-items:center;gap:8px;margin-top:10px}.pr .in{flex:1;min-width:0}
  .x{background:none;border:0;color:var(--red);font-weight:700;font-size:.85rem;padding:8px 4px;cursor:pointer}
  .sm{padding:10px 18px;border-radius:999px;border:1.5px solid var(--green);background:#fff;color:var(--green);font-weight:700;font-size:.85rem;cursor:pointer;transition:background .25s var(--ease),color .25s var(--ease)}
  .sm:hover{background:var(--green);color:#fff}
  .add-new{width:100%;border-style:dashed;padding:14px}
  .pub{background:var(--red);border-color:var(--red);color:#fff}.pub:hover{background:var(--red-d);border-color:var(--red-d)}
  .sub-h{font-size:.82rem;font-weight:700;margin-top:20px;color:var(--ink-2)}
  .pb{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:12px}
  .pb .st{font-size:.8rem;color:var(--ink-2);line-height:1.3}.pb .st.dirty{color:var(--red);font-weight:700}
  .pb .acts{display:flex;gap:8px;flex-shrink:0}
  .upl{display:flex;align-items:center;gap:12px}
  .th{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--cream-2);flex-shrink:0}
  .upl label.sm{margin:0}.upl label.busy{opacity:.5;pointer-events:none}
  .pr{background:#FAFAF8;border:1px solid var(--line);border-radius:12px;padding:12px;flex-direction:column;align-items:stretch;gap:10px}
  .pr-top,.pr-bot{display:flex;align-items:center;gap:8px}.pr-bot{justify-content:space-between}
  .msg{position:fixed;left:16px;right:16px;bottom:84px;z-index:50;max-width:520px;margin:0 auto;padding:12px 16px;border-radius:12px;font-size:.88rem;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.18);opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease)}
  .msg.show{opacity:1;transform:none}.msg.ok{background:var(--green);color:#fff}.msg.er{background:var(--red);color:#fff}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="card">
    <img src="images/inflammation-kitchen-logo.png" alt="Inflammation Kitchen">
    <h3>Admin access</h3>
    <p class="hint">Enter the admin password to manage the menu.</p>
    <input class="in" type="password" id="pw" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="go">Log in</button>
    <p class="err" id="lerr" hidden></p>
  </div>
</div>

<div id="app" hidden>
  <header class="hd">
    <div class="top">
      <div class="brand"><img src="images/inflammation-kitchen-logo.png" alt=""><b>Menu admin</b></div>
      <button class="ic" id="out" aria-label="Log out" title="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </div>
    <nav class="seg" id="seg"><button data-t="settings" class="on">Hours</button><button data-t="platters">Platters</button><button data-t="combos">Combos</button></nav>
  </header>
  <main class="ad" id="root"></main>
  <div class="pb">
    <span class="st" id="st">Loading</span>
    <div class="acts"><button class="sm" id="save">Save draft</button><button class="sm pub" id="publish">Publish</button></div>
  </div>
  <div class="msg" id="msg" role="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="menu-data.js"></script>
<script>
var ADMIN_EMAIL = 'admin@inflammationkitchen.com';  
var sb = getSb(), state = null, dirty = false, tab = 'settings', openId = null;
var $ = function(id){ return document.getElementById(id); };
var chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

function at(v){ return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function flag(t, c){ var s = $('st'); s.textContent = t; s.className = 'st' + (c ? ' ' + c : ''); }
function markDirty(){ dirty = true; flag('Unsaved changes', 'dirty'); }
function setP(path, v){ var k = path.split('.'), o = state; for(var i = 0; i < k.length - 1; i++) o = o[k[i]]; o[k[k.length - 1]] = v; }
function dp(p, t){ return ' data-p="' + p + '"' + (t ? ' data-t="' + t + '"' : ''); }
function fld(label, p, v, t){ return '<label class="f"><span>' + label + '</span><input class="in" type="' + (t === 'num' ? 'number' : t === 'time' ? 'time' : 'text') + '"' + (t === 'num' ? ' inputmode="numeric"' : '') + dp(p, t) + ' value="' + at(v) + '"></label>'; }
function tg(label, p, v){ return '<label class="tg"><input type="checkbox"' + dp(p, 'bool') + (v ? ' checked' : '') + '><span>' + label + '</span></label>'; }
function up(p, v, label){ return '<div class="upl"><img class="th" src="' + at(v) + '" alt="" onerror="this.style.visibility=\'hidden\'" onload="this.style.visibility=\'visible\'"><label class="sm">' + label + '<input type="file" accept="image/*" hidden data-up="' + p + '"></label></div>'; }
function ac(id, head, body){ return '<div class="ac' + (openId === id ? ' open' : '') + '" data-id="' + id + '"><button class="ah" data-a="tog">' + head + chev + '</button><div class="ab">' + body + '</div></div>'; }

function platterCard(p, i){
  var b = 'platters.' + i + '.';
  return ac('p' + i, '<span class="hn"><b data-h="' + b + 'name">' + esc(p.name || 'New platter') + '</b><small data-h="' + b + 'price">' + naira(p.price) + '</small></span><span class="chip" data-hs="' + b + 'soldOut"' + (p.soldOut ? '' : ' hidden') + '>Sold out</span>',
    '<div class="g2">' + fld('Name', b + 'name', p.name) + fld('Price (\u20A6)', b + 'price', p.price, 'num') + fld('Notice needed (hours, 0 = same day)', b + 'notice', p.notice, 'num') + fld('Ribbon label (optional)', b + 'tag', p.tag) + '</div>' +
    '<div class="f"><span>Photo</span>' + up(b + 'img', p.img, 'Change photo') + '</div>' + fld('Image path (fills in when you upload)', b + 'img', p.img) +
    '<label class="f"><span>Inside (one per line)</span><textarea class="in"' + dp(b + 'items', 'lines') + '>' + esc((p.items || []).join('\n')) + '</textarea></label>' +
    '<div class="row2">' + tg('Sold out', b + 'soldOut', p.soldOut) + '<button class="x" data-a="dp" data-i="' + i + '">Delete platter</button></div>');
}
function comboCard(c, i){
  var b = 'combos.' + i + '.', rows = c.proteins.map(function(p, j){
    var def = 'images/' + slug(c.base) + '-' + slug(p.name) + '.jpg';
    return '<div class="pr"><div class="pr-top"><input class="in" type="text"' + dp(b + 'proteins.' + j + '.name') + ' value="' + at(p.name) + '"><button class="x" data-a="dr" data-i="' + i + '" data-j="' + j + '" aria-label="Remove protein">\u2715</button></div>' +
      '<div class="pr-bot">' + up(b + 'proteins.' + j + '.img', p.img || def, p.img ? 'Change photo' : 'Add photo') + tg('Sold out', b + 'proteins.' + j + '.soldOut', p.soldOut) + '</div></div>';
  }).join('');
  return ac('c' + i, '<span class="hn"><b data-h="' + b + 'base">' + esc(c.base || 'New combo') + '</b><small data-h="' + b + 'price">' + naira(c.price) + '</small></span>',
    '<div class="g2">' + fld('Base name', b + 'base', c.base) + fld('Price (\u20A6)', b + 'price', c.price, 'num') + fld('Notice needed (hours)', b + 'notice', c.notice, 'num') + fld('Short description', b + 'sub', c.sub) + '</div>' +
    '<p class="sub-h">Proteins: switch on Sold out to hide one for today</p>' + rows +
    '<div class="row2"><button class="sm" data-a="ar" data-i="' + i + '">+ Add protein</button><button class="x" data-a="dc" data-i="' + i + '">Delete combo</button></div>');
}
function render(){
  var s = state.settings, h = '';
  document.querySelectorAll('#seg button').forEach(function(b){ b.classList.toggle('on', b.dataset.t === tab); });
  if(tab === 'settings'){
    h = '<div class="card"><div class="g2">' + fld('Opens', 'settings.open', s.open, 'time') + fld('Closes', 'settings.close', s.close, 'time') + '</div>' +
      '<div class="row2" style="margin-top:20px"><span class="hint">Pause orders: customers can browse but cannot send an order.</span>' + tg('Paused', 'settings.paused', s.paused) + '</div>' +
      fld('Message shown while paused', 'settings.pauseMessage', s.pauseMessage) + '</div>';
  } else if(tab === 'platters'){
    h = state.platters.map(platterCard).join('') + '<button class="sm add-new" data-a="ap">+ Add platter</button>';
  } else {
    h = state.combos.map(comboCard).join('') + '<button class="sm add-new" data-a="ac">+ Add combo</button>';
  }
  $('root').innerHTML = h;
}
function msg(t, ok){ var m = $('msg'); m.textContent = t; m.className = 'msg show ' + (ok ? 'ok' : 'er'); clearTimeout(m._t); m._t = setTimeout(function(){ m.classList.remove('show'); }, 4000); }

$('seg').addEventListener('click', function(e){ var b = e.target.closest('button'); if(!b) return; tab = b.dataset.t; openId = null; render(); window.scrollTo(0, 0); });
$('root').addEventListener('input', function(e){
  var t = e.target, p = t.dataset.p; if(!p) return;
  var v = t.type === 'checkbox' ? t.checked : t.dataset.t === 'num' ? (Number(t.value) || 0) : t.dataset.t === 'lines' ? t.value.split('\n').map(function(x){ return x.trim(); }).filter(Boolean) : t.value;
  setP(p, v); markDirty();
  document.querySelectorAll('[data-h="' + p + '"]').forEach(function(h){ h.textContent = /price$/.test(p) ? naira(v) : (v || 'Untitled'); });
  document.querySelectorAll('[data-hs="' + p + '"]').forEach(function(h){ h.hidden = !v; });
});
$('root').addEventListener('click', function(e){
  var b = e.target.closest('[data-a]'); if(!b) return;
  var x = b.dataset.a, i = +b.dataset.i, j = +b.dataset.j;
  if(x === 'tog'){
    var el = b.closest('.ac'), was = el.classList.contains('open');
    $('root').querySelectorAll('.ac.open').forEach(function(o){ o.classList.remove('open'); });
    if(was) openId = null; else { el.classList.add('open'); openId = el.dataset.id; }
    return;
  }
  if(x === 'ap'){ state.platters.push({ id:'platter-' + Date.now().toString(36), name:'New platter', price:0, notice:0, soldOut:false, tag:'', img:'images/platter-new.png', items:[] }); openId = 'p' + (state.platters.length - 1); }
  else if(x === 'dp'){ if(!confirm('Delete this platter?')) return; state.platters.splice(i, 1); openId = null; }
  else if(x === 'ac'){ state.combos.push({ base:'New', sub:'', price:15000, notice:0, proteins:[{ name:'Chicken' }] }); openId = 'c' + (state.combos.length - 1); }
  else if(x === 'dc'){ if(!confirm('Delete this combo?')) return; state.combos.splice(i, 1); openId = null; }
  else if(x === 'ar') state.combos[i].proteins.push({ name:'New protein' });
  else if(x === 'dr') state.combos[i].proteins.splice(j, 1);
  markDirty(); render();
});

function shrink(file, max){
  return new Promise(function(res, rej){
    var u = URL.createObjectURL(file), i = new Image();
    i.onload = function(){
      var k = Math.min(1, max / i.width), c = document.createElement('canvas');
      c.width = Math.round(i.width * k); c.height = Math.round(i.height * k);
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(function(b){ b ? res(b) : rej(new Error('Could not process the image')); }, 'image/jpeg', .85);
    };
    i.onerror = function(){ rej(new Error('That file is not a readable image')); };
    i.src = u;
  });
}
$('root').addEventListener('change', async function(e){
  var t = e.target, path = t.dataset.up; if(!path || !t.files[0]) return;
  var lab = t.closest('label'), thumb = t.closest('.upl').querySelector('.th'), txt = lab.firstChild.textContent;
  lab.classList.add('busy'); lab.firstChild.textContent = 'Uploading';
  try{
    var blob = await shrink(t.files[0], 1600);
    var name = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7) + '.jpg';
    var r = await sb.storage.from('menu-photos').upload(name, blob, { contentType:'image/jpeg', cacheControl:'31536000' });
    if(r.error) throw r.error;
    var url = sb.storage.from('menu-photos').getPublicUrl(name).data.publicUrl;
    setP(path, url); markDirty(); thumb.src = url; thumb.style.visibility = 'visible';
    document.querySelectorAll('input[data-p="' + path + '"]').forEach(function(i){ i.value = url; });
    msg('Photo uploaded. Save draft or Publish to keep it.', true);
    txt = 'Change photo';
  }catch(err){ msg('Upload failed: ' + (err.message || err), false); }
  lab.firstChild.textContent = txt; lab.classList.remove('busy'); t.value = '';
});

function busy(btn, on){ btn.disabled = on; btn.style.opacity = on ? .5 : 1; }
async function saveDraft(){
  var r = await sb.from('menu_draft').upsert({ id:1, data:state, updated_at:new Date().toISOString() });
  if(r.error){ msg('Could not save: ' + r.error.message, false); return false; }
  dirty = false; flag('Draft saved', ''); return true;
}
$('save').onclick = async function(){ busy(this, true); if(await saveDraft()) msg('Draft saved. Customers will not see it until you publish.', true); busy(this, false); };
$('publish').onclick = async function(){
  if(!confirm('Publish this menu to the live site?')) return;
  busy(this, true);
  if(await saveDraft()){
    var r = await sb.from('menu_published').upsert({ id:1, data:state, updated_at:new Date().toISOString() });
    if(r.error) msg('Publish failed: ' + r.error.message, false); else { flag('Published. Live site is up to date.', ''); msg('Published. The live site now shows this menu.', true); }
  }
  busy(this, false);
};

async function enter(){
  $('login').hidden = true; $('app').hidden = false;
  var r = await sb.from('menu_draft').select('data').eq('id', 1).single();
  var d = r.data && r.data.data;
  state = (d && d.platters && d.combos) ? d : JSON.parse(JSON.stringify(DEFAULT_MENU));
  state.settings = Object.assign({}, DEFAULT_MENU.settings, state.settings);
  render(); flag(d && d.platters ? 'Draft loaded' : 'Showing the built-in menu. Save draft to keep it.', '');
}
$('go').onclick = async function(){
  var btn = this, e = $('lerr'); e.hidden = true; busy(btn, true);
  var r = await sb.auth.signInWithPassword({ email:ADMIN_EMAIL, password:$('pw').value });
  busy(btn, false);
  if(r.error){ e.textContent = 'Wrong password.'; e.hidden = false; return; }
  enter();
};
$('pw').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('go').click(); });
$('out').onclick = async function(){ await sb.auth.signOut(); location.reload(); };
window.addEventListener('beforeunload', function(e){ if(dirty){ e.preventDefault(); e.returnValue = ''; } });
sb.auth.getSession().then(function(r){ if(r.data.session) enter(); });
</script>
</body>
</html>
