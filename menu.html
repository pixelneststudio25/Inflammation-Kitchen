<script src="cart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var root = document.getElementById('menu-root'), tabs = document.getElementById('tabs');
  function section(id, title, sub){
    var s = document.createElement('section'); s.id = id; s.className = 'menu-sec';
    s.innerHTML = '<h2>' + esc(title) + '</h2><p class="sub">' + esc(sub) + '</p><div class="menu-grid"></div>';
    root.appendChild(s);
    var t = document.createElement('button'); t.className = 'tab'; t.textContent = title;
    t.onclick = function(){ s.scrollIntoView({behavior:'smooth', block:'start'}); };
    tabs.appendChild(t);
    return s.querySelector('.menu-grid');
  }

  var pg = section('platters', 'Platters', 'Loaded and made to share.');
  MENU.platters.forEach(function(p){
    var a = document.createElement('article'); a.className = 'platter pl' + (p.tag ? ' big' : '');
    a.innerHTML = '<div class="p-img"><img src="' + esc(p.img) + '" alt="' + esc(p.name) + '" loading="lazy">' + (p.tag ? '<span class="p-ribbon">' + esc(p.tag) + '</span>' : '') + '<h3>' + esc(p.name) + '</h3></div><div class="p-body">' +
      '<p class="p-label">What\'s inside</p><ul class="p-list">' + p.items.map(function(i){ return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>' +
      (p.notice ? '<span class="tag">Order ' + p.notice + 'h ahead</span>' : '') +
      '<div class="p-foot"><span class="price">' + naira(p.price) + '</span><button class="add" data-id="' + esc(p.id) + '" data-name="' + esc(p.name) + ' platter" data-price="' + p.price + '" data-notice="' + p.notice + '">Add to order</button></div></div>';
    pg.appendChild(a);
  });

  MENU.combos.forEach(function(c){
    var g = section(slug(c.base) + '-combos', c.base + ' combos', c.sub + '. Pick your protein.');
    c.proteins.forEach(function(p, i){
      var id = slug(c.base) + '-' + slug(p), a = document.createElement('article'); a.className = 'platter';
      a.innerHTML = '<div class="p-img"><img src="images/' + id + '.jpg" alt="' + esc(c.base + ' and ' + p) + '" loading="lazy"></div><div class="p-body"><h3>' + esc(c.base + ' and ' + p) + '</h3>' +
        '<div class="p-foot"><span class="price">' + naira(c.price) + '</span><button class="add" data-id="' + esc(id) + '" data-name="' + esc(c.base + ' and ' + p) + '" data-price="' + c.price + '" data-notice="' + c.notice + '">Add to order</button></div></div>';
      g.appendChild(a);
    });
  });

  if(window.initReveal) initReveal();

  // Active tab follows scroll
  var secs = root.querySelectorAll('.menu-sec'), btns = tabs.querySelectorAll('.tab');
  btns[0].classList.add('active');
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ var i = Array.prototype.indexOf.call(secs, e.target); btns.forEach(function(b,j){ b.classList.toggle('active', i === j); }); } }); }, { rootMargin:'-30% 0px -60% 0px' });
    secs.forEach(function(s){ io.observe(s); });
  }
});
</script>
</body>
